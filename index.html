<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zindua Hackathon Master Planning Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.min.js"></script>
 
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="./dist/output.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FFFFFF;
            --surface: #FFFFFF;
            --surface-muted: #F8F9FA;
            --surface-soft: #F3F4F6;
            --text-primary: #111827;
            --text-secondary: #4B5563;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --accent: #E52E2E;
            --accent-hover: #C92323;
            --secondary-accent: #0091AD;
            --secondary-accent-hover: #00798F;
            --warning: #F59E0B;
            --success: #16A34A;
            --data: #2563EB;
            --partner: #7C3AED;
            --neutral: #6B7280;
            --dark-surface: #0F0F0F;
        }

        [data-theme="dark"] {
            --bg-primary: #111827;
            --surface: #1F2937;
            --surface-muted: #172033;
            --surface-soft: #374151;
            --text-primary: #F9FAFB;
            --text-secondary: #D1D5DB;
            --text-muted: #9CA3AF;
            --border: #374151;
            --accent: #F04444;
            --accent-hover: #FF5A5A;
            --secondary-accent: #29B8CF;
            --secondary-accent-hover: #0091AD;
            --warning: #FBBF24;
            --success: #4ADE80;
            --data: #60A5FA;
            --partner: #A78BFA;
            --neutral: #9CA3AF;
            --dark-surface: #0F0F0F;
        }

        [data-theme] {
            color: var(--text-primary);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: Inter, Poppins, 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.55;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .card-dragging {
            opacity: 0.5;
        }

        .dropzone-active {
            border: 2px dashed var(--accent);
            background-color: rgba(229, 46, 46, 0.08);
        }

        .priority-critical { color: var(--accent); }
        .priority-high { color: var(--warning); }
        .priority-medium { color: var(--data); }
        .priority-low { color: var(--neutral); }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-draft { background: var(--surface-soft); color: var(--text-secondary); }
        .status-in-progress { background: #DBEAFE; color: #1E3A8A; }
        .status-ready { background: #DCFCE7; color: #166534; }
        .status-blocked { background: #FEE2E2; color: #991B1B; }

        .kanban-column {
            flex: 0 0 280px;
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            min-height: 400px;
        }

        .kanban-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: grab;
            transition: all 0.2s;
        }

        .kanban-card:active {
            cursor: grabbing;
        }

        .kanban-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-color: var(--secondary-accent);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: var(--surface);
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15);
        }

        .overdue {
            color: var(--accent);
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--surface-muted);
            font-weight: 600;
            font-size: 13px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(229, 46, 46, 0.14);
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--surface-soft);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--secondary-accent);
            color: #FFFFFF;
        }

        .btn-export:hover {
            background: var(--secondary-accent);
            color: #FFFFFF;
            border-color: var(--secondary-accent);
        }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .badge-risk-high {
            background: #fee2e2;
            color: #dc2626;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-risk-must-have {
            background: #fee2e2;
            color: #dc2626;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-risk-core {
            background: #fef3c7;
            color: #d97706;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-risk-nice-to-have {
            background: #dcfce7;
            color: #16a34a;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-risk-medium {
            background: #fef3c7;
            color: #d97706;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-risk-low {
            background: #dcfce7;
            color: #16a34a;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .status-label {
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .resource-number {
            width: 96px;
            padding: 2px 4px;
            border: 1px solid transparent;
            background: transparent;
        }

        .resource-number:hover,
        .resource-number:focus {
            border-color: #E5E5E0;
            background: var(--surface);
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--dark-surface);
            color: #FFFFFF;
            border: 1px solid var(--dark-surface);
        }

        .theme-toggle:hover {
            background: var(--secondary-accent);
            border-color: var(--secondary-accent);
        }

        .theme-icon {
            flex: 0 0 auto;
        }

        .text-gray-900 { color: var(--text-primary) !important; }
        .text-gray-700,
        .text-gray-600 { color: var(--text-secondary) !important; }
        .text-gray-500,
        .text-gray-400 { color: var(--text-muted) !important; }
        .text-red-600,
        .text-red-700 { color: var(--accent) !important; }
        .text-green-600 { color: var(--success) !important; }
        .text-orange-600 { color: var(--warning) !important; }
        .text-blue-600,
        .text-blue-700 { color: var(--secondary-accent) !important; }
        .text-purple-600,
        .text-purple-700 { color: var(--partner) !important; }
        .bg-white { background-color: var(--surface) !important; }
        .bg-gray-200 { background-color: var(--border) !important; }
        .bg-blue-50 { background-color: rgba(37, 99, 235, 0.1) !important; }
        .bg-red-50 { background-color: rgba(229, 46, 46, 0.1) !important; }
        .bg-red-100 { background-color: rgba(229, 46, 46, 0.15) !important; }
        .bg-blue-100 { background-color: rgba(37, 99, 235, 0.14) !important; }
        .bg-purple-100 { background-color: rgba(124, 58, 237, 0.14) !important; }
        .border-blue-500 { border-color: var(--data) !important; }
        .border-red-500 { border-color: var(--accent) !important; }
        .border-gray-200 { border-color: var(--border) !important; }

        [data-theme="dark"] .status-in-progress { background: #1E3A8A; color: #DBEAFE; }
        [data-theme="dark"] .status-ready { background: #14532D; color: #DCFCE7; }
        [data-theme="dark"] .status-blocked { background: #7F1D1D; color: #FEE2E2; }
        [data-theme="dark"] .badge-risk-must-have { background: #7F1D1D; color: #FEE2E2; }
        [data-theme="dark"] .badge-risk-core { background: #78350F; color: #FEF3C7; }
        [data-theme="dark"] .badge-risk-nice-to-have { background: #14532D; color: #DCFCE7; }
        [data-theme="dark"] .btn-danger { background: #7F1D1D; color: #FEE2E2; }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body, #root {
            min-width: 0;
            max-width: 100%;
        }

        body {
            overflow-x: hidden;
        }

        button, input, select, textarea {
            max-width: 100%;
        }

        @media (max-width: 1024px) {
            header.card {
                margin: 12px;
                padding: 20px;
            }

            header.card > .flex.justify-between {
                flex-wrap: wrap;
                gap: 20px;
            }

            header.card > .flex.justify-between > :first-child {
                min-width: 0;
            }

            header.card > .flex.justify-between > :last-child {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                width: 100%;
            }

            .grid.grid-cols-5 {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .grid.grid-cols-4 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .grid.grid-cols-3 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .grid.grid-cols-3 > .col-span-2 {
                grid-column: span 2 / span 2;
            }

            .kanban-column {
                flex-basis: 260px;
            }
        }

        @media (max-width: 640px) {
            header.card {
                margin: 8px;
                padding: 16px;
                margin-bottom: 16px;
            }

            header.card h1 {
                font-size: 1.65rem;
                line-height: 1.15;
            }

            header.card h2 {
                font-size: 1.05rem;
            }

            header.card > .flex.justify-between > :last-child .btn {
                flex: 1 1 calc(50% - 8px);
                min-width: 120px;
            }

            header.card .flex.gap-4.items-center {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            .px-4 {
                padding-left: 12px;
                padding-right: 12px;
            }

            .grid.grid-cols-5,
            .grid.grid-cols-4,
            .grid.grid-cols-3,
            .grid.grid-cols-2 {
                grid-template-columns: minmax(0, 1fr);
            }

            .grid.grid-cols-3 > .col-span-2 {
                grid-column: auto;
            }

            .card.p-6 {
                padding: 16px;
            }

            .flex.justify-between.items-center.mb-4 {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .flex.justify-between.items-center.mb-4 .btn {
                width: 100%;
            }

            .card.p-4.flex.gap-4.items-center {
                align-items: stretch;
                flex-direction: column;
                gap: 10px;
            }

            .card.p-4.flex.gap-4.items-center .btn,
            .card.p-4.flex.gap-4.items-center select {
                width: 100%;
                flex: none;
            }

            .modal {
                width: calc(100% - 24px);
                padding: 18px;
                max-height: 90vh;
            }

            .modal form > .flex.gap-3 {
                flex-wrap: wrap;
            }

            .modal form > .flex.gap-3 .btn {
                min-width: calc(50% - 6px);
            }

            .modal form > .flex.gap-4 {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .modal form > .flex.gap-4 label {
                max-width: 100%;
            }

            .status-badge,
            .badge-risk-high,
            .badge-risk-medium,
            .badge-risk-low,
            .badge-risk-must-have,
            .badge-risk-core,
            .badge-risk-nice-to-have {
                white-space: normal;
                text-align: center;
            }

            .kanban-column {
                flex-basis: min(260px, calc(100vw - 40px));
            }

            table {
                min-width: 720px;
            }
        }
    </style>
</head>
<body>
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useContext, createContext, useCallback } = React;

        // Persistent state hook
        const usePersistentState = (key, initialValue) => {
            const [state, setState] = useState(() => {
                try {
                    const stored = localStorage.getItem(key);
                    return stored ? JSON.parse(stored) : initialValue;
                } catch {
                    return initialValue;
                }
            });

            const setPersistentState = useCallback((value) => {
                setState(value);
                localStorage.setItem(key, JSON.stringify(value));
            }, [key]);

            return [state, setPersistentState];
        };

        // Utility functions
        const formatDate = (date) => {
            if (!date) return '';
            return new Date(date).toLocaleDateString('en-GB', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        };

        const isOverdue = (date) => {
            if (!date) return false;
            return new Date(date) < new Date() && new Date(date).toDateString() !== new Date().toDateString();
        };

        const daysUntilHackathon = () => {
            const hackathonDate = new Date('2026-11-07');
            const today = new Date();
            const diff = hackathonDate - today;
            const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
            return Math.max(0, days);
        };

        const normalizePartnerPriority = (priority) => ({
            High: 'Must-Have',
            Medium: 'Core',
            Low: 'Nice-to-Have'
        }[priority] || priority || 'Nice-to-Have');

        const ThemeIcon = ({ isDark }) => (
            <svg
                className="theme-icon"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                aria-hidden="true"
            >
                {isDark ? (
                    <>
                        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z" />
                    </>
                ) : (
                    <>
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
                    </>
                )}
            </svg>
        );

        // Modal Component
        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-bold">{title}</h2>
                            <button onClick={onClose} className="text-2xl text-gray-400 hover:text-gray-600">&times;</button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        };

        // Add Partner Modal
        const AddPartnerModal = ({ isOpen, onClose, onAdd }) => {
            const [formData, setFormData] = useState({
                name: '',
                contact: '',
                status: 'TO CONTACT',
                problemBrief: false,
                dataShared: false,
                lastContact: '',
                followUpDate: '',
                risk: 'Nice-to-Have',
                notes: ''
            });

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: type === 'checkbox' ? checked : value
                }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (formData.name.trim()) {
                    onAdd(formData);
                    setFormData({
                        name: '',
                        contact: '',
                        status: 'TO CONTACT',
                        problemBrief: false,
                        dataShared: false,
                        lastContact: '',
                        followUpDate: '',
                        risk: 'Nice-to-Have',
                        notes: ''
                    });
                    onClose();
                }
            };

            return (
                <Modal isOpen={isOpen} onClose={onClose} title="Add Partner">
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div>
                            <label className="block text-sm font-600 mb-2">Partner Name</label>
                            <input type="text" name="name" value={formData.name} onChange={handleChange} required />
                        </div>
                        <div>
                            <label className="block text-sm font-600 mb-2">Contact Person</label>
                            <input type="text" name="contact" value={formData.contact} onChange={handleChange} />
                        </div>
                        <div>
                            <label className="block text-sm font-600 mb-2">Status</label>
                            <select name="status" value={formData.status} onChange={handleChange}>
                                <option>TO CONTACT</option>
                                <option>CONTACTED / AWAITING REPLY</option>
                                <option>IN DISCUSSIONS</option>
                                <option>AT RISK / BACKUP</option>
                            </select>
                        </div>
                        <div className="flex gap-4">
                            <label className="flex items-center gap-2">
                                <input type="checkbox" name="problemBrief" checked={formData.problemBrief} onChange={handleChange} />
                                <span className="text-sm">Problem Brief Provided</span>
                            </label>
                            <label className="flex items-center gap-2">
                                <input type="checkbox" name="dataShared" checked={formData.dataShared} onChange={handleChange} />
                                <span className="text-sm">Data Shared</span>
                            </label>
                        </div>
                        <div>
                            <label className="block text-sm font-600 mb-2">Last Contact</label>
                            <input type="date" name="lastContact" value={formData.lastContact} onChange={handleChange} />
                        </div>
                        <div>
                            <label className="block text-sm font-600 mb-2">Follow-up Date</label>
                            <input type="date" name="followUpDate" value={formData.followUpDate} onChange={handleChange} />
                        </div>
                        <div>
                            <label className="block text-sm font-600 mb-2">Action Priority</label>
                            <select name="risk" value={formData.risk} onChange={handleChange}>
                                <option value="Must-Have">Must-Have (Critical for the event's success)</option>
                                <option value="Core">Core (Highly valuable)</option>
                                <option value="Nice-to-Have">Nice-to-Have (Bonus partner if time permits)</option>
                            </select>
                        </div>
                        <div>
                            <label className="block text-sm font-600 mb-2">Notes</label>
                            <textarea name="notes" value={formData.notes} onChange={handleChange} rows="3"></textarea>
                        </div>
                        <div className="flex gap-3 pt-4">
                            <button type="submit" className="btn btn-primary flex-1">Add Partner</button>
                            <button type="button" onClick={onClose} className="btn btn-secondary flex-1">Cancel</button>
                        </div>
                    </form>
                </Modal>
            );
        };

        // Edit Partner Modal
        const EditPartnerModal = ({ isOpen, onClose, partner, onUpdate, onDelete }) => {
            const [formData, setFormData] = useState(partner ? { ...partner, risk: normalizePartnerPriority(partner.risk) } : {});

            useEffect(() => {
                setFormData(partner ? { ...partner, risk: normalizePartnerPriority(partner.risk) } : {});
            }, [partner]);

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: type === 'checkbox' ? checked : value
                }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onUpdate(formData);
                onClose();
            };

            const handleDelete = () => {
                if (confirm('Are you sure you want to delete this partner?')) {
                    onDelete(formData.id);
                    onClose();
                }
            };

            return (
                <Modal isOpen={isOpen} onClose={onClose} title="Edit Partner">
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div>
                            <label className="block text-sm font-600 mb-2">Partner Name</label>
                            <input type="text" name="name" value={formData.name || ''} onChange={handleChange} />
                        </div>
                        <div>
                            <label className="block text-sm font-600 mb-2">Contact Person</label>
                            <input type="text" name="contact" value={formData.contact || ''} onChange={handleChange} />
                        </div>
                        <div>
                            <label className="block text-sm font-600 mb-2">Status</label>
                            <select name="status" value={formData.status || ''} onChange={handleChange}>
                                <option>TO CONTACT</option>
                                <option>CONTACTED / AWAITING REPLY</option>
                                <option>IN DISCUSSIONS</option>
                                <option>AT RISK / BACKUP</option>
                            </select>
                        </div>
                        <div className="flex gap-4">
                            <label className="flex items-center gap-2">
                                <input type="checkbox" name="problemBrief" checked={formData.problemBrief || false} onChange={handleChange} />
                                <span className="text-sm">Problem Brief Provided</span>

            const [draggedTask, setDraggedTask] = useState(null);

            const handleDragStart = (e, task) => {
                setDraggedTask(task);

            const handleDragOver = (e) => {
                e.preventDefault();
            };

            const handleDrop = (e, status) => {
                e.preventDefault();
                if (draggedTask) {
                    onTaskStatusChange(draggedTask.id, status);
                    setDraggedTask(null);
                }
            };

            const getPartnerName = (id) => partners.find(p => p.id === id)?.name || '';
            const getProblemTitle = (id) => problems.find(p => p.id === id)?.title || '';

            const getTasksForStatus = (status) => tasks.filter(t => t.status === status);

            const getPriorityClass = (priority) => {
                switch (priority) {
                    case 'Critical': return 'priority-critical';
                    case 'High': return 'priority-high';
                    case 'Medium': return 'priority-medium';
                    case 'Low': return 'priority-low';
                    default: return 'priority-low';
                }
            };

            return (
                <div className="overflow-x-auto pb-4">
                    <div className="flex gap-4" style={{ minWidth: '100%' }}>
                        {statuses.map(status => (
                            <div
                                key={status}
                                className="kanban-column"
                                onDragOver={handleDragOver}
                                onDrop={(e) => handleDrop(e, status)}
                            >
                                <div className="font-600 text-sm mb-4 text-gray-700">{status}</div>
                                <div className="space-y-2">
                                    {getTasksForStatus(status).map(task => (

                                            draggable
                                            onDragStart={(e) => handleDragStart(e, task)}
                                            onClick={() => onEditTask(task)}
                                            className={`kanban-card cursor-pointer ${draggedTask?.id === task.id ? 'card-dragging' : ''}`}
                                        >
                                            <div className="font-600 text-sm mb-2">{task.title}</div>
                                            {task.owner && <div className="text-xs text-gray-600 mb-1">{task.owner}</div>}
                                            <div className={`text-xs font-600 mb-2 ${getPriorityClass(task.priority)}`}>
                                                {task.priority || ''}
                                            </div>
                                            {task.dueDate && (
                                                <div className={`text-xs mb-2 ${isOverdue(task.dueDate) ? 'overdue' : 'text-gray-600'}`}>

                                                </div>
                                            )}

                                                <div className="text-xs text-purple-600 mb-1">
                                                    {getPartnerName(task.relatedPartner)}
                                                </div>
                                            )}

                                                        setEditPartnerOpen(true);
                                                    }}
                                                />
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Problems */}
                        <div className="mb-8">
                            <h2 className="section-title">PROBLEM BRIEFS & DATA TRACKER</h2>
                            {problems.map(problem => (
                                <ProblemCard
                                    key={problem.id}
                                    problem={problem}
                                    onEdit={(p) => {
                                        setEditingProblem(p);
                                        setEditProblemOpen(true);
                                    }}
                                />
                            ))}
                        </div>

                        {/* Task Filtering */}
                        <div className="mb-4">
                            <h2 className="section-title">MASTER TASK BOARD</h2>
                            <div className="card p-4 mb-4 flex gap-4 items-center">
                                <select value={taskFilter.workstream} onChange={(e) => setTaskFilter({...taskFilter, workstream: e.target.value})} className="flex-1">
                                    <option value="All">All Workstreams</option>
                                    <option value="Partnerships">Partnerships</option>
                                    <option value="Challenge Design">Challenge Design</option>
                                    <option value="Data">Data</option>
                                    <option value="Technical">Technical</option>
                                    <option value="Operations">Operations</option>
                                    <option value="Marketing">Marketing</option>
                                    <option value="Judging">Judging</option>
                                    <option value="Budget">Budget</option>
                                    <option value="Participant Management">Participant Management</option>
                                </select>
                                <select value={taskFilter.priority} onChange={(e) => setTaskFilter({...taskFilter, priority: e.target.value})} className="flex-1">
                                    <option value="All">All Priorities</option>
                                    <option value="Low">Low</option>
                                    <option value="Medium">Medium</option>
                                    <option value="High">High</option>
                                    <option value="Critical">Critical</option>
                                </select>
                                <button onClick={() => setTaskFilter({workstream: 'All', priority: 'All', owner: 'All', due: 'All'})} className="btn btn-secondary">
                                    Clear Filters
                                </button>
                            </div>
                        </div>

                        {/* Kanban */}
                        <div className="mb-8">
                            <KanbanBoard
                                tasks={filteredTasks}
                                onTaskStatusChange={handleTaskStatusChange}
                                onEditTask={(t) => {
                                    setEditingTask(t);
                                    setEditTaskOpen(true);
                                }}
                                partners={partners}
                                problems={problems}
                            />
                        </div>

                        {/* Upcoming Deadlines */}
                        <div className="grid grid-cols-3 gap-4 mb-8">
                            <div className="col-span-2">
                                <h2 className="section-title">UPCOMING DEADLINES</h2>
                                <div className="card p-4">
                                    {upcomingDeadlines.length === 0 ? (
                                        <div className="text-gray-600">No upcoming deadlines</div>
                                    ) : (
                                        <div className="space-y-3">
                                            {upcomingDeadlines.map((deadline, i) => (
                                                <div key={i} className="flex justify-between items-start p-3 border-b border-gray-200 last:border-b-0">
                                                    <div>
                                                        <div className="font-600 text-sm">{deadline.title}</div>
                                                        <div className={`text-xs ${deadline.isOverdue ? 'overdue' : 'text-gray-600'}`}>
                                                            {deadline.isOverdue ? 'OVERDUE - ' : ''}
                                                            {formatDate(deadline.date)}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Current Risks */}
                            <div>
                                <h2 className="section-title">CURRENT RISKS</h2>
                                <div className="card p-4">
                                    {highRiskPartners.length + blockedTasks.length + blockedProblems.length + overdueTasks.length === 0 ? (
                                        <div className="text-green-600 font-600 text-sm">No critical risks</div>
                                    ) : (
                                        <div className="space-y-3">
                                            {highRiskPartners.map(p => (
                                                <div key={p.id} className="text-xs">
                                                    <div className="fon
                                                    t-600 text-red-600">{p.name}</div>
                                                    <div className="text-gray-600">Must-Have partner</div>
                                                </div>
                                            ))}
                                            {blockedTasks.map(t => (
                                                <div key={t.id} className="text-xs">
                                                    <div className="font-600 text-red-600">{t.title}</div>
                                                    <div className="text-gray-600">Blocked task</div>
                                                </div>
                                            ))}
                                            {blockedProblems.map(p => (
                                                <div key={p.id} className="text-xs">
                                                    <div className="font-600 text-orange-600">{p.title}</div>
                                                    <div className="text-gray-600">Blocked problem</div>
                                                </div>
                                            ))}
                                            {overdueTasks.slice(0, 2).map(t => (
                                                <div key={t.id} className="text-xs">
                                                    <div className="font-600 text-red-600">{t.title}</div>
                                                    <div className="text-gray-600">Overdue</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Budget */}
                        <div className="mb-8">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="section-title mb-0">WORKING BUDGET & RESOURCE ALLOCATION</h2>
                                <button onClick={() => setAddBudgetOpen(true)} className="btn btn-primary">+ Add Budget Item</button>
                            </div>
                            <div className="card overflow-x-auto">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Category</th>
                                            <th>Item</th>
                                            <th>Estimated (KES)</th>
                                            <th>Actual (KES)</th>
                                            <th>Variance</th>
                                            <th>Funding Source</th>
                                            <th>Status</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {budget.map(item => (
                                            <tr key={item.id}>
                                                <td className="text-sm">{item.category}</td>
                                                <td className="text-sm">{item.item}</td>
                                                <td className="text-sm">{parseFloat(item.estimated || 0).toLocaleString()}</td>
                                                <td className="text-sm">{item.actual ? parseFloat(item.actual).toLocaleString() : '—'}</td>
                                                <td className="text-sm">{item.actual ? (parseFloat(item.estimated || 0) - parseFloat(item.actual)).toLocaleString() : '—'}</td>
                                                <td className="text-sm text-gray-600">{item.fundingSource}</td>
                                                <td>
                                                    <span className={`status-badge ${item.status === 'Planned' ? 'status-draft' : item.status === 'Paid' ? 'status-ready' : 'status-in-progress'}`}>
                                                        {item.status}
                                                    </span>
                                                </td>
                                                <td>
                                                    <button
                                                        onClick={() => {
                                                            setEditingBudget(item);
                                                            setEditBudgetOpen(true);
                                                        }}
                                                        className="btn btn-secondary"
                                                    >
                                                        Edit
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <div className="grid grid-cols-4 gap-4 mt-4">
                                <div className="card p-4">
                                    <div className="text-xs text-gray-600 mb-1">Total Estimated</div>
                                    <div className="text-2xl font-bold">KES {totalEstimated.toLocaleString()}</div>
                                </div>
                                <div className="card p-4">
                                    <div className="text-xs text-gray-600 mb-1">Total Actual</div>
                                    <div className="text-2xl font-bold">{totalActual === 0 ? 'KES 0' : 'KES ' + totalActual.toLocaleString()}</div>
                                </div>
                                <div className="card p-4">
                                    <div className="text-xs text-gray-600 mb-1">Total Variance</div>
                                    <div className="text-2xl font-bold text-green-600">+KES {totalVariance.toLocaleString()}</div>
                                </div>
                                <div className="card p-4">
                                    <div className="text-xs text-gray-600 mb-1">Remaining Gap</div>
                                    <div className="text-2xl font-bold text-orange-600">KES {Math.max(0, totalEstimated - totalActual).toLocaleString()}</div>
                                </div>
                            </div>
                        </div>

                        {/* Resources */}
                        <div className="mb-8">
                            <h2 className="section-title">RESOURCE ALLOCATION</h2>
                            <div className="grid grid-cols-3 gap-4">
                                <div className="card p-6">
                                    <div className="text-sm font-600 mb-4">Technical Mentors</div>
                                    <div className="flex justify-between items-center mb-3">
                                        <div>
                                            <input type="number" min="0" value={resources.technicalMentorsConfirmed} onChange={(e) => handleResourceChange('technicalMentorsConfirmed', e.target.value)} className="resource-number text-2xl font-bold" aria-label="Confirmed technical mentors" />
                                            <div className="text-xs text-gray-600">Confirmed</div>
                                        </div>
                                        <div className="text-right">
                                            <input type="number" min="0" value={resources.technicalMentorsRequired} onChange={(e) => handleResourceChange('technicalMentorsRequired', e.target.value)} className="resource-number text-2xl font-bold text-gray-400 text-right" aria-label="Required technical mentors" />
                                            <div className="text-xs text-gray-600">Required</div>
                                        </div>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                        <div className="bg-blue-600 h-2 rounded-full" style={{width: `${(resources.technicalMentorsConfirmed / resources.technicalMentorsRequired) * 100}%`}}></div>
                                    </div>
                                </div>
                                <div className="card p-6">
                                    <div className="text-sm font-600 mb-4">Judges</div>
                                    <div className="flex justify-between items-center mb-3">
                                        <div>
                                            <input type="number" min="0" value={resources.judgesConfirmed} onChange={(e) => handleResourceChange('judgesConfirmed', e.target.value)} className="resource-number text-2xl font-bold" aria-label="Confirmed judges" />
                                            <div className="text-xs text-gray-600">Confirmed</div>
                                        </div>
                                        <div className="text-right">
                                            <input type="number" min="0" value={resources.judgesRequired} onChange={(e) => handleResourceChange('judgesRequired', e.target.value)} className="resource-number text-2xl font-bold text-gray-400 text-right" aria-label="Required judges" />
                                            <div className="text-xs text-gray-600">Required</div>
                                        </div>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                        <div className="bg-green-600 h-2 rounded-full" style={{width: `${(resources.judgesConfirmed / resources.judgesRequired) * 100}%`}}></div>
                                    </div>
                                </div>
                                <div className="card p-6">
                                    <div className="text-sm font-600 mb-4">Participants</div>
                                    <div className="flex justify-between items-center mb-3">
                                        <div>
                                            <input type="number" min="0" value={resources.participantsRegistered} onChange={(e) => handleResourceChange('participantsRegistered', e.target.value)} className="resource-number text-2xl font-bold" aria-label="Registered participants" />
                                            <div className="text-xs text-gray-600">Registered</div>
                                        </div>
                                        <div className="text-right">
                                            <input type="number" min="0" value={resources.participantsTarget} onChange={(e) => handleResourceChange('participantsTarget', e.target.value)} className="resource-number text-2xl font-bold text-gray-400 text-right" aria-label="Target participants" />
                                            <div className="text-xs text-gray-600">Target</div>
                                        </div>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                        <div className="bg-purple-600 h-2 rounded-full" style={{width: `${Math.min(100, (resources.participantsRegistered / resources.participantsTarget) * 100)}%`}}></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Modals */}
                    <AddPartnerModal isOpen={addPartnerOpen} onClose={() => setAddPartnerOpen(false)} onAdd={handleAddPartner} />
                    <EditPartnerModal isOpen={editPartnerOpen} onClose={() => setEditPartnerOpen(false)} partner={editingPartner} onUpdate={handleUpdatePartner} onDelete={handleDeletePartner} />
                    <AddTaskModal isOpen={addTaskOpen} onClose={() => setAddTaskOpen(false)} onAdd={handleAddTask} problems={problems} partners={partners} />
                    <EditTaskModal isOpen={editTaskOpen} onClose={() => setEditTaskOpen(false)} task={editingTask} onUpdate={handleUpdateTask} onDelete={handleDeleteTask} problems={problems} partners={partners} />
                    <AddProblemModal isOpen={addProblemOpen} onClose={() => setAddProblemOpen(false)} onAdd={handleAddProblem} />
                    <EditProblemModal isOpen={editProblemOpen} onClose={() => setEditProblemOpen(false)} problem={editingProblem} onUpdate={handleUpdateProblem} onDelete={handleDeleteProblem} />
                    <BudgetModal isOpen={addBudgetOpen} onClose={() => setAddBudgetOpen(false)} onSave={handleAddBudget} onDelete={handleDeleteBudget} />
                    <BudgetModal isOpen={editBudgetOpen} onClose={() => setEditBudgetOpen(false)} budgetItem={editingBudget} onSave={handleUpdateBudget} onDelete={handleDeleteBudget} />
                </div>
            );
        };

        // Render
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
